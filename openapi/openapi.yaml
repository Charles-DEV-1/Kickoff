{
  "openapi": "3.1.0",
  "info": {
    "title": "Kickoff Online MVP API",
    "version": "1.0.0",
    "description": "Contract for the implemented online-only MVP routes. Offline replay, routines, reminders, analytics, and other deferred product endpoints are not part of this contract."
  },
  "servers": [
    {
      "url": "https://{apiHost}",
      "description": "Deployed API origin; set this to the selected deployment host.",
      "variables": {
        "apiHost": {
          "default": "api.example.com",
          "description": "Vercel deployment domain."
        }
      }
    },
    {
      "url": "http://127.0.0.1:5000",
      "description": "Local Flask development server."
    }
  ],
  "tags": [
    {
      "name": "System"
    },
    {
      "name": "Profile"
    },
    {
      "name": "Tasks"
    },
    {
      "name": "Step actions"
    },
    {
      "name": "Templates"
    },
    {
      "name": "AI breakdown"
    },
    {
      "name": "Internal operations",
      "description": "Server-to-server only. Never call from the frontend."
    }
  ],
  "paths": {
    "/v1/health": {
      "get": {
        "operationId": "health",
        "summary": "Liveness",
        "description": "Returns process liveness without checking Supabase.",
        "tags": [
          "System"
        ],
        "security": [],
        "responses": {
          "200": {
            "description": "API process is alive.",
            "headers": {
              "X-Request-Id": {
                "description": "Request correlation ID (also returned on errors).",
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Health"
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },
    "/v1/health/ready": {
      "get": {
        "operationId": "readiness",
        "summary": "Supabase Auth readiness",
        "description": "Checks reachability of Supabase Auth. This is not a database/RPC readiness check.",
        "tags": [
          "System"
        ],
        "security": [],
        "responses": {
          "200": {
            "description": "Supabase Auth is reachable.",
            "headers": {
              "X-Request-Id": {
                "description": "Request correlation ID (also returned on errors).",
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Readiness"
                }
              }
            }
          },
          "503": {
            "description": "Supabase Auth is not reachable or configuration is missing.",
            "headers": {
              "X-Request-Id": {
                "description": "Request correlation ID (also returned on errors).",
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Readiness"
                }
              }
            }
          }
        }
      }
    },
    "/v1/me": {
      "get": {
        "operationId": "getMe",
        "summary": "Get my profile",
        "tags": [
          "Profile"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "$ref": "#/components/parameters/IfNoneMatch"
          }
        ],
        "responses": {
          "200": {
            "description": "Profile and settings.",
            "headers": {
              "X-Request-Id": {
                "description": "Request correlation ID (also returned on errors).",
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              },
              "ETag": {
                "description": "Representation validator. Send it in If-None-Match on the next read.",
                "schema": {
                  "type": "string"
                }
              },
                  "Cache-Control": {
                    "description": "Cache policy for this representation.",
                    "schema": {
                      "type": "string"
                    }
                  }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Profile"
                },
                "example": {
                  "id": "11111111-1111-4111-8111-111111111111",
                  "display_name": null,
                  "language": "en",
                  "timezone": "Africa/Lagos",
                  "settings": {
                    "calm_mode": true
                  },
                  "created_at": "2026-01-01T10:00:00Z",
                  "updated_at": "2026-01-01T10:00:00Z"
                }
              }
            }
          },
          "304": {
            "description": "Profile is unchanged.",
            "headers": {
              "X-Request-Id": {
                "description": "Request correlation ID (also returned on errors).",
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              },
              "ETag": {
                "description": "Representation validator. Send it in If-None-Match on the next read.",
                "schema": {
                  "type": "string"
                }
              },
              "Cache-Control": {
                "description": "Cache policy for this representation.",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "503": {
            "$ref": "#/components/responses/ServiceUnavailable"
          }
        }
      },
      "patch": {
        "operationId": "patchMe",
        "summary": "Merge profile/settings fields",
        "description": "Updates only supplied fields. Settings are merged by key; unknown profile/settings keys return 422.",
        "tags": [
          "Profile"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ProfilePatch"
              },
              "example": {
                "display_name": "Alex",
                "settings": {
                  "calm_mode": false
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Updated profile.",
            "headers": {
              "X-Request-Id": {
                "description": "Request correlation ID (also returned on errors).",
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Profile"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "413": {
            "$ref": "#/components/responses/PayloadTooLarge"
          },
          "415": {
            "$ref": "#/components/responses/UnsupportedMediaType"
          },
          "422": {
            "$ref": "#/components/responses/ValidationError"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "503": {
            "$ref": "#/components/responses/ServiceUnavailable"
          }
        }
      },
      "delete": {
        "operationId": "deleteMyAccount",
        "summary": "Request account deletion",
        "description": "Requires exact confirmation. Locks API/RLS access immediately, then queues Supabase Auth soft deletion and 30-day data purge.",
        "tags": [
          "Profile"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DeleteAccountRequest"
              },
              "example": {
                "confirm": "DELETE"
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Deletion accepted; access is already locked.",
            "headers": {
              "X-Request-Id": {
                "description": "Request correlation ID (also returned on errors).",
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DeleteAccountAccepted"
                },
                "example": {
                  "status": "pending",
                  "requested_at": "2026-01-01T10:00:00Z",
                  "purge_after": "2026-01-31T10:00:00Z",
                  "auth_deletion_status": "pending_retry"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "413": {
            "$ref": "#/components/responses/PayloadTooLarge"
          },
          "415": {
            "$ref": "#/components/responses/UnsupportedMediaType"
          },
          "422": {
            "$ref": "#/components/responses/ValidationError"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "503": {
            "$ref": "#/components/responses/ServiceUnavailable"
          }
        }
      }
    },
