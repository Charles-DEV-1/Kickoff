  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Supabase end-user access token obtained from the signed-in frontend Supabase session."
      },
      "cronBearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "opaque",
        "description": "Server-only CRON_SECRET. Never provide to frontend code."
      }
    },
    "parameters": {
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "description": "Unique per write action; 8–128 characters. Reuse the same value and identical body for retries.",
        "schema": {
          "type": "string",
          "minLength": 8,
          "maxLength": 128,
          "pattern": "^[A-Za-z0-9._:-]{8,128}$"
        },
        "example": "task-create-8a1f9347"
      },
      "IfNoneMatch": {
        "name": "If-None-Match",
        "in": "header",
        "required": false,
        "description": "Send a previously received ETag to receive 304 when the representation is unchanged.",
        "schema": {
          "type": "string"
        },
        "example": "W/\"e83ac0\""
      }
    },
