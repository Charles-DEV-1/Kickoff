    "/v1/tasks": {
      "get": {
        "operationId": "listTasks",
        "summary": "List or delta-read tasks",
        "description": "Normal mode returns active/completed/archived resources. Supplying updated_since selects delta mode and includes soft-delete tombstones. Follow next_cursor within a stable snapshot before advancing next_since.",
        "tags": [
          "Tasks"
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "name": "status",
            "in": "query",
            "required": false,
            "description": "Task status filter.",
            "schema": {
              "type": "string",
              "enum": [
                "active",
                "completed",
                "archived",
                "all"
              ],
              "default": "active"
            }
          },
          {
            "name": "due_date",
            "in": "query",
            "required": false,
            "description": "Exact UTC calendar date (YYYY-MM-DD).",
            "schema": {
              "type": "string",
              "format": "date"
            }
          },
          {
            "name": "updated_since",
            "in": "query",
            "required": false,
            "description": "Timezone-qualified ISO 8601 server cursor; older than 30 days returns full_refresh_required.",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "snapshot_at",
            "in": "query",
            "required": false,
            "description": "Server-issued snapshot cursor for subsequent delta pages; requires updated_since.",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "description": "Opaque cursor returned by the previous page.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "description": "Page size, 1–50; default 20.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 50,
              "default": 20
            }
          },
          {
            "$ref": "#/components/parameters/IfNoneMatch"
          }
        ],
        "responses": {
          "200": {
            "description": "Private task page or delta page.",
            "headers": {
              "X-Request-Id": {
                "description": "Request correlation ID (also returned on errors).",
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              },
              "ETag": {
                "description": "Representation validator. Send it in If-None-Match on the next read.",
                "schema": {
                  "type": "string"
                }
              },
              "Cache-Control": {
                "description": "Cache policy for this representation.",
                "schema": {
                  "type": "string"
                }
              },
              "X-Server-Time": {
                "description": "Server-generated time for delta responses.",
                "schema": {
                  "type": "string",
                  "format": "date-time"
                }
              },
              "X-Snapshot-At": {
                "description": "Stable snapshot time for this page set.",
                "schema": {
                  "type": "string",
                  "format": "date-time"
                }
              },
              "X-Next-Since": {
                "description": "Server-generated cursor for the next delta window.",
                "schema": {
                  "type": "string",
                  "format": "date-time"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TaskListOrDelta"
                }
              }
            }
          },
          "304": {
            "description": "Task page is unchanged.",
            "headers": {
              "X-Request-Id": {
                "description": "Request correlation ID (also returned on errors).",
                "schema": {
                  "type": "string",
                  "format": "uuid"
                }
              },
              "ETag": {
                "description": "Representation validator. Send it in If-None-Match on the next read.",
                "schema": {
                  "type": "string"
                }
              },
              "Cache-Control": {
                "description": "Cache policy for this representation.",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "413": {
            "$ref": "#/components/responses/PayloadTooLarge"
          },
          "422": {
            "$ref": "#/components/responses/ValidationError"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "503": {
            "$ref": "#/components/responses/ServiceUnavailable"
          }
        }
      },
